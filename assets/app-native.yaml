apiVersion: deploy.xzd5/v1
kind: WebApp

metadata:
  name: sample-app
  displayName: 示例应用
  version: 1.0.0

spec:
  route:
    path: /tools/sample-app
    mode: native

  container:
    port: 3000

  health:
    path: /health
    expectedStatus: 200

  persistence:
    mode: files
    containerPath: /app/data
    # Fail closed. Add only exact operator-managed subtrees after completing
    # the DATA_SAFETY.md inventory. Never add user data or a shared parent.
    mutablePaths: []

  accessControl:
    enabled: false
    # When true, copy the exact provider policy ID; never infer it from route/name.
    # provider: learning-platform
    # appId: <exact-policy-id>

  env: []

  entrypoints:
    - key: home
      name: 首页
      path: /
      primary: true

  smokeTests:
    - path: /
      method: GET
      expectedStatus: 200
      contentType: text/html

  resources:
    cpus: "0.5"
    memory: 256m
    pids: 128
